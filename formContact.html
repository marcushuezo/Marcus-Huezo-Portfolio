<body>
<div id="wrapper">
<header id="banner">
    <div class="container">
        <nav id="navigation">
            <h4>
                <a href="index.html">Home</a>
                <a class="aboutLink" href="about.html">About Me</a>
                <a class="projectsLink" href="projects.html">Projects</a>
                <a class="lastLink currentLink" href="formContact.html">Contact Me</a>
            </h4>
            <div class="clear"></div>
        </nav>
    </div>
</header>

<section id="formContent" class="container">
    <h1>Contact Me</h1>
    <p>Lets get in touch, Fill out the form below!</p>

    <form id="contactForm" action="mailto:marcus.huezo@bell.net" method="post" enctype="text/plain" name="form">
        <p>
            <label for="name">Name</label><br>
            <input class="form-fillout" type="text" id="name" name="name" size="32" placeholder="Your Name" required>
        </p>
        <p>
            <label for="email">Email</label><br>
            <input class="form-fillout" type="email" id="email" name="email" size="40" placeholder="Your Email Address" required>
        </p>
        <p>
            <label for="cell">Cell Number</label><br>
            <input class="form-fillout" type="tel" id="cell" name="cell" size="32" placeholder="Your Phone Number" required>
        </p>
        <p>
            <label for="comments">Comments</label><br>
            <textarea class="form-fillout" id="comments" name="comments" cols="40" rows="6" placeholder="Your Message To Me" required></textarea>
        </p>
        <p>
            <input class="form-button" type="submit" value="Submit">
            <input class="form-button" type="reset" value="Reset">
        </p>
    </form>
</section>

<footer id="footer">
    <div class="container">
        <p>Email: <a href="mailto:marcus.huezo@bell.net">marcus.huezo@bell.net</a></p>

    </div>
